<title>Félix Bayard</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,Arial,sans-serif;
background:#050816;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}
.bg{
position:fixed;inset:0;
background:
radial-gradient(circle at 15% 20%, rgba(56,189,248,.22), transparent 28%),
radial-gradient(circle at 85% 25%, rgba(168,85,247,.18), transparent 30%),
radial-gradient(circle at 50% 80%, rgba(34,197,94,.10), transparent 25%);
filter:blur(10px);
animation:drift 14s ease-in-out infinite alternate;
}
.bg::after{
content:'';
position:absolute; inset:-20%;
background:radial-gradient(circle, rgba(255,255,255,.05) 1px, transparent 1px);
background-size:40px 40px;
opacity:.25;
}
@keyframes drift{
from{transform:translate(-20px,-10px) scale(1)}
to{transform:translate(20px,15px) scale(1.08)}
}
.card{
position:relative;
width:430px;
max-width:92%;
padding:32px;
border-radius:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(22px);
border:1px solid rgba(255,255,255,.12);
box-shadow:0 25px 80px rgba(0,0,0,.45);
text-align:center;
animation:appear .9s ease;
}
@keyframes appear{
from{opacity:0;transform:translateY(25px)}
to{opacity:1;transform:none}
}
.avatar{
width:190px;height:190px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,.25);
box-shadow:0 10px 30px rgba(0,0,0,.35);
}
h1{margin:18px 0 8px;font-size:2rem}
.info{opacity:.9;margin:8px 0}
.socials{display:flex;justify-content:center;gap:22px;margin:22px 0}
.socials a{color:white;font-size:32px;transition:.2s}
.socials a:hover{transform:scale(1.15)}
.btn{
display:block;
margin-top:12px;
padding:14px;
border-radius:14px;
text-decoration:none;
color:white;
background:rgba(255,255,255,.10);
transition:.2s;
}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
